<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작업 모음 · kwonyujin119</title>
<meta name="description" content="GitHub에서 작업한 페이지들을 미리보기와 링크로 한곳에 모은 앱">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="작업모음">
<style>
  :root {
    --bg: #0f172a; --bg2: #111c33; --card: #1e293b; --card2: #243247;
    --text: #e2e8f0; --muted: #94a3b8; --line: #334155;
    --accent: #60a5fa; --accent2: #22d3ee; --chip: #0b1222;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --radius: 18px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f1f5f9; --bg2: #e8eef6; --card: #ffffff; --card2: #f8fafc;
      --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --accent: #2563eb; --accent2: #0891b2; --chip: #eef2f7;
      --shadow: 0 10px 30px rgba(15,23,42,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .bar { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line); flex: none; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; line-height: 1; white-space: nowrap;
  }
  .btn.primary { background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; border-color: transparent; }
  .btn:active { transform: translateY(1px); }
  .icon-btn { width: 38px; height: 38px; padding: 0; justify-content: center; border-radius: 50%; font-size: 17px; }

  .tools { max-width: 1200px; margin: 10px auto 0; display: flex; gap: 8px; align-items: center; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; height: 38px; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15px; min-width: 0; }
  .search input::placeholder { color: var(--muted); }
  .toggle { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .lbl-short { display: none; }
  @media (max-width: 420px) { .lbl-long { display: none; } .lbl-short { display: inline; } }

  main { max-width: 1200px; margin: 0 auto; padding: 14px 16px 0; }
  .status { font-size: 12px; color: var(--muted); margin: 0 0 10px 2px; min-height: 16px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .thumb {
    position: relative; aspect-ratio: 16 / 10; background: var(--card2); overflow: hidden; display: block;
    border-bottom: 1px solid var(--line);
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .thumb iframe {
    position: absolute; left: 0; top: 0; border: 0; pointer-events: none; background: #fff;
    width: var(--fw, 1280px); height: calc(var(--fw, 1280px) * 10 / 16); z-index: 1;
    transform-origin: 0 0; transform: scale(var(--sc, .25));
  }
  .thumb .veil { position: absolute; inset: 0; }
  .thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; gap: 6px; }
  .thumb .badge {
    position: absolute; left: 10px; top: 10px; z-index: 2; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
    background: rgba(15,23,42,.72); color: #fff; backdrop-filter: blur(6px);
  }
  .thumb .badge.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 6px; vertical-align: 1px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .title h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
  .title .repo { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
  .chip.lang::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--accent)); margin-right: 5px; }
  .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .actions .btn { padding: 9px 14px; font-size: 13px; }
  .actions .btn.go { flex: 1; justify-content: center; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  footer { max-width: 1200px; margin: 28px auto 0; padding: 0 16px; font-size: 12px; color: var(--muted); text-align: center; }

  /* 설치 안내 시트 */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 40; }
  .sheet-bg.on { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); color: var(--text);
    border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .25s ease; max-width: 560px; margin: 0 auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,.35);
  }
  .sheet.on { transform: none; }
  .sheet h3 { margin: 0 0 8px; font-size: 17px; }
  .sheet ol { margin: 8px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .sheet .row { display: flex; gap: 8px; margin-top: 14px; }
  .sheet .row .btn { flex: 1; justify-content: center; }
  .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: -6px auto 12px; }
  .sheet a { text-decoration: underline; color: var(--accent); }
  .sheet .note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .sheet .err { color: #ef4444; font-size: 13px; min-height: 18px; margin-top: 8px; }
  .field {
    width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2);
    color: var(--text); padding: 0 14px; font-size: 16px; outline: none; margin-top: 10px;
  }
  .field:focus { border-color: var(--accent); }
  .wide { width: 100%; justify-content: center; height: 46px; font-size: 15px; }

  /* 입장 잠금 화면 */
  body.locked { overflow: hidden; }
  body.locked header, body.locked main, body.locked footer { visibility: hidden; }
  .lock {
    position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 24px 16px;
    background:
      radial-gradient(1000px 520px at 15% -10%, #312e81 0%, transparent 60%),
      radial-gradient(800px 480px at 110% 110%, #155e75 0%, transparent 55%), #0b1222;
    color: #e2e8f0;
  }
  body.locked .lock { display: grid; }
  .lock-box { width: 100%; max-width: 340px; text-align: center; }
  .lock-box img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .lock-box h2 { margin: 18px 0 4px; font-size: 21px; letter-spacing: -.01em; }
  .lock-box p { margin: 0 0 20px; color: #94a3b8; font-size: 13.5px; }
  .code-in {
    width: 100%; height: 56px; border-radius: 16px; border: 1px solid #334155; background: rgba(255,255,255,.06);
    color: #fff; font-size: 24px; letter-spacing: .45em; text-indent: .45em; text-align: center; outline: none;
  }
  .code-in:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,.25); }
  .lock-box .btn { width: 100%; justify-content: center; height: 50px; margin-top: 12px; font-size: 16px; }
  .lock-err { min-height: 20px; margin-top: 12px; font-size: 13.5px; color: #f87171; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  /* 관리자 표시 */
  .admin-pill { display: none; background: linear-gradient(135deg, #f59e0b, #eab308); color: #1f1300; border: 0; font-weight: 800; }
  body.admin .admin-pill { display: inline-flex; }
  @media (max-width: 420px) { body.admin .avatar { display: none; } }
  body.admin #keyBtn { display: none; }
  body.admin header { border-bottom: 2px solid #f59e0b; }
  body.admin header::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, #f59e0b, #fde047, #f59e0b);
  }
  .admin-banner { display: none; margin: 0 0 12px; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5;
    background: color-mix(in srgb, #f59e0b 14%, var(--card)); border: 1px solid color-mix(in srgb, #f59e0b 45%, var(--line)); }
  body.admin .admin-banner { display: block; }

  /* 카드 공개/비공개 */
  .vis {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 12px;
    border-radius: 12px; background: var(--chip); border: 1px dashed color-mix(in srgb, #f59e0b 60%, var(--line));
    font-size: 13px; font-weight: 700;
  }
  .vis small { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #94a3b8; transition: background .15s; }
  .switch span::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + span { background: #10b981; }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.is-hidden { opacity: .6; border-style: dashed; }
  .card.is-hidden:hover { opacity: .9; }
  .card.changed { box-shadow: 0 0 0 2px #f59e0b, var(--shadow); }
  .thumb .badge.private { left: auto; right: 10px; background: #b91c1c; }

  .savebar {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30;
    transform: translate(-50%, 160%); transition: transform .2s ease;
    display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px);
    background: #111827; color: #fff; border: 1px solid #f59e0b; border-radius: 999px;
    padding: 8px 8px 8px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 13.5px; white-space: nowrap;
  }
  .savebar.on { transform: translate(-50%, 0); }
  .savebar .btn { padding: 9px 14px; }
  .savebar .btn:not(.primary) { background: transparent; color: #fff; border-color: #475569; }
  .toast {
    position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top)); z-index: 70;
    transform: translate(-50%, -16px); opacity: 0; pointer-events: none; transition: .2s ease;
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100% - 32px); text-align: center;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: #b91c1c; }
</style>
</head>
<body class="locked">
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <form class="lock-box" id="lockForm" autocomplete="off">
    <img src="icons/icon-192.png" alt="">
    <h2 id="lockTitle">작업 모음</h2>
    <p>입장 코드를 입력하세요</p>
    <input class="code-in" id="lockCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" aria-label="입장 코드">
    <button class="btn primary" type="submit">입장</button>
    <div class="lock-err" id="lockErr" role="alert"></div>
  </form>
</div>

<header>
  <div class="bar">
    <img class="avatar" id="avatar" alt="" src="https://avatars.githubusercontent.com/u/276926550?v=4&s=96">
    <div class="brand">
      <h1>작업 모음</h1>
      <p id="subtitle">github.com/kwonyujin119</p>
    </div>
    <button class="btn primary" id="installBtn" hidden>⤓ <span class="lbl-long">앱 설치</span><span class="lbl-short">설치</span></button>
    <button class="btn admin-pill" id="adminPill" title="관리자 메뉴">🛡 관리자</button>
    <button class="btn icon-btn" id="keyBtn" title="관리자 로그인" aria-label="관리자 로그인">🔑</button>
    <button class="btn icon-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">◐</button>
  </div>
  <div class="tools">
    <label class="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="제목, 설명, 리포 이름 검색" autocomplete="off">
    </label>
    <label class="toggle"><input type="checkbox" id="liveToggle" checked> <span class="lbl-long">라이브 미리보기</span><span class="lbl-short">라이브</span></label>
  </div>
</header>

<main>
  <p class="status" id="status"></p>
  <div class="admin-banner"><b>🛡 관리자 모드</b> · 카드마다 공개 스위치가 있습니다. 끄면 비공개가 되어 일반 사용자에게 보이지 않고, 관리자에게만 흐리게 보입니다. 바꾼 뒤 아래 <b>저장</b>을 누르세요.</div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer>
  카드 데이터는 <a href="https://github.com/kwonyujin119/testall/blob/main/data.js" style="text-decoration:underline">data.js</a>에서 고칠 수 있습니다 · 새 리포는 자동으로 추가됩니다
</footer>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="handle"></div>
  <h3 id="sheetTitle">홈 화면에 추가</h3>
  <div id="sheetBody"></div>
  <div class="row"><button class="btn" id="sheetClose">닫기</button></div>
</div>

<div class="savebar" id="savebar" role="status">
  <span id="saveMsg"></span>
  <button class="btn" id="saveCancel">취소</button>
  <button class="btn primary" id="saveBtn">저장</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
(() => {
  const OWNER = window.WORKS_OWNER || "kwonyujin119";
  const HIDE = new Set(window.WORKS_HIDE || []);
  const $ = (s) => document.querySelector(s);
  const grid = $("#grid"), status = $("#status"), q = $("#q"), liveToggle = $("#liveToggle");

  const LANG_DOT = { HTML: "#e34c26", JavaScript: "#f1e05a", Python: "#3572A5", CSS: "#563d7c", TypeScript: "#3178c6" };
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso), diff = (Date.now() - d) / 864e5;
    if (diff < 1) return "오늘"; if (diff < 2) return "어제"; if (diff < 30) return `${Math.floor(diff)}일 전`;
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} }
  };
  let toastTimer;
  const toast = (msg, bad) => {
    const t = $("#toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), bad ? 4500 : 2800);
  };

  // ---------- 입장·관리자 코드 (코드 자체가 아니라 SHA-256 해시만 둠) ----------
  const SITE_REPO = "testall";
  const H_USER  = "2665d9a4ca67380011b27d3b9790634af0e206acd8b98c9ed981dae43683ff9f";
  const H_ADMIN = "9a974c81eae5b03719db6deb9e92679cabeba57020b8f02cb66a0989681c62ec";
  const sha256 = async (s) => {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("testall:" + s));
    return Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, "0")).join("");
  };
  const savedAuth = store.get("works:auth");
  let role = savedAuth === H_ADMIN ? "admin" : savedAuth === H_USER ? "user" : null;

  // ---------- 공개/비공개 (visibility.json) ----------
  let hidden = new Set();   // 저장된 비공개 목록
  let pending = null;       // 관리자가 바꾸는 중인 목록 (저장 전)
  const visOf = () => pending || hidden;
  const changedCount = () => {
    if (!pending) return 0;
    let n = 0;
    for (const r of pending) if (!hidden.has(r)) n++;
    for (const r of hidden) if (!pending.has(r)) n++;
    return n;
  };
  async function loadVisibility() {
    try {
      const r = await fetch("visibility.json", { cache: "no-store" });
      if (r.ok) hidden = new Set((await r.json()).hidden || []);
    } catch {}
    // 방금 저장한 기기는 배포가 끝나기 전에도 저장한 값을 바로 씀
    try {
      const o = JSON.parse(store.get("works:visSaved") || "null");
      if (o && Date.now() - o.t < 10 * 60 * 1000) hidden = new Set(o.hidden);
    } catch {}
    render();
  }

  // ---------- 데이터: data.js + GitHub API(10분 캐시) ----------
  let works = (window.WORKS || []).map((w) => ({ ...w }));
  async function refreshFromGitHub() {
    const KEY = "works:gh", TTL = 10 * 60 * 1000;
    let repos = null;
    try {
      const c = JSON.parse(localStorage.getItem(KEY) || "null");
      if (c && Date.now() - c.t < TTL) repos = c.repos;
    } catch {}
    if (!repos) {
      try {
        const r = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=updated`, { headers: { Accept: "application/vnd.github+json" } });
        if (!r.ok) throw new Error(r.status);
        repos = (await r.json()).map((x) => ({
          name: x.name, desc: x.description, lang: x.language, pushed: x.pushed_at, pages: x.has_pages,
          size: x.size, stars: x.stargazers_count, branch: x.default_branch, url: x.html_url
        }));
        try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), repos })); } catch {}
      } catch (e) { ghStamp = "GitHub 최신 정보를 불러오지 못했습니다"; render(); return; }
    }
    const byName = new Map(repos.map((r) => [r.name, r]));
    for (const w of works) {
      const r = byName.get(w.repo); if (!r) continue;
      w.lang = r.lang; w.pushed = r.pushed; w.stars = r.stars; w.gh = r.url;
      if (!w.desc && r.desc) w.desc = r.desc;
    }
    for (const r of repos) {
      if (HIDE.has(r.name) || works.some((w) => w.repo === r.name) || r.size === 0) continue;
      works.push({
        repo: r.name, title: r.name, desc: r.desc || "", lang: r.lang, pushed: r.pushed, stars: r.stars, gh: r.url,
        url: r.pages ? `https://${OWNER}.github.io/${r.name}/` : null, tags: [], auto: true
      });
    }
    works.sort((a, b) => new Date(b.pushed || 0) - new Date(a.pushed || 0));
    ghStamp = `GitHub 기준 ${fmtDate(repos[0]?.pushed)} 갱신`;
    render();
  }
  let ghStamp = "";
  function updateStatus(all) {
    const priv = all.filter((w) => visOf().has(w.repo)).length;
    const parts = role === "admin"
      ? [`${all.length}개 작업`, `공개 ${all.length - priv}`, `비공개 ${priv}`]
      : [`${all.length - all.filter((w) => hidden.has(w.repo)).length}개 작업`];
    if (ghStamp) parts.push(ghStamp);
    status.textContent = parts.join(" · ");
  }

  // ---------- 렌더 ----------
  let live = true;
  try { live = localStorage.getItem("works:live") !== "0"; } catch {}
  liveToggle.checked = live;
  liveToggle.addEventListener("change", () => { live = liveToggle.checked; try { localStorage.setItem("works:live", live ? "1" : "0"); } catch {} render(); });
  q.addEventListener("input", render);

  const io = ("IntersectionObserver" in window) ? new IntersectionObserver((ents) => {
    for (const en of ents) if (en.isIntersecting) { loadFrame(en.target); io.unobserve(en.target); }
  }, { rootMargin: "200px 0px" }) : null;

  function loadFrame(thumb) {
    const src = thumb.dataset.src; if (!src || thumb.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.title = "미리보기"; f.loading = "lazy"; f.tabIndex = -1; f.setAttribute("aria-hidden", "true");
    f.referrerPolicy = "no-referrer";
    f.src = src;
    thumb.insertBefore(f, thumb.firstChild);
    fitFrame(thumb);
    f.addEventListener("load", () => { const ph = thumb.querySelector(".ph"); if (ph) ph.remove(); });
  }
  function fitFrame(thumb) {
    const w = thumb.clientWidth || 360; const FW = w < 420 ? 960 : 1280;
    thumb.style.setProperty("--fw", FW + "px"); thumb.style.setProperty("--sc", (w / FW).toFixed(4));
  }
  window.addEventListener("resize", () => document.querySelectorAll(".thumb[data-src]").forEach(fitFrame));

  function ogImage(repo) { return `https://opengraph.githubassets.com/1/${OWNER}/${repo}`; }

  function visHTML(priv) {
    return priv ? `🔒 비공개<small>관리자만 보임</small>` : `🌐 공개<small>모두에게 보임</small>`;
  }
  function paintCard(card) {
    const repo = card.dataset.repo, priv = visOf().has(repo);
    card.classList.toggle("is-hidden", priv);
    card.classList.toggle("changed", !!pending && pending.has(repo) !== hidden.has(repo));
    const lab = card.querySelector(".vis-label"); if (lab) lab.innerHTML = visHTML(priv);
    const b = card.querySelector(".badge.private"); if (b) b.hidden = !priv;
    const i = card.querySelector(".switch input"); if (i) i.checked = !priv;
  }

  function render() {
    if (!role) { grid.innerHTML = ""; return; }
    const isAdmin = role === "admin";
    const kw = q.value.trim().toLowerCase();
    const all = works.filter((w) => !HIDE.has(w.repo));
    updateStatus(all);
    const list = all.filter((w) => isAdmin || !hidden.has(w.repo)).filter((w) =>
      !kw || [w.title, w.desc, w.repo, ...(w.tags || [])].join(" ").toLowerCase().includes(kw));
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = `<div class="empty">${kw ? "검색 결과가 없습니다" : "공개된 작업이 없습니다"}</div>`; return; }
    for (const w of list) {
      const gh = w.gh || `https://github.com/${OWNER}/${w.repo}${w.branch ? `/tree/${w.branch}` : ""}`;
      const open = w.url || gh;
      const card = document.createElement("article"); card.className = "card"; card.dataset.repo = w.repo;
      const useLive = live && !!w.url;
      card.innerHTML = `
        <a class="thumb" href="${esc(open)}" target="_blank" rel="noopener" ${useLive ? `data-src="${esc(w.url)}"` : ""} aria-label="${esc(w.title)} 열기">
          ${useLive
            ? `<div class="ph">불러오는 중…</div>`
            : `<img loading="lazy" alt="" src="${esc(ogImage(w.repo))}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'미리보기 없음'}))">`}
          <span class="veil"></span>
          <span class="badge ${w.url ? "live" : ""}">${w.url ? (useLive ? "LIVE" : "PAGES") : "GITHUB"}</span>
          ${isAdmin ? `<span class="badge private" hidden>🔒 비공개</span>` : ""}
        </a>
        <div class="body">
          ${isAdmin ? `<div class="vis"><span class="vis-label"></span>
            <label class="switch" title="공개 / 비공개"><input type="checkbox" aria-label="${esc(w.title)} 공개"><span></span></label></div>` : ""}
          <div class="title"><h2>${esc(w.title)}</h2><span class="repo">${esc(w.repo)}</span></div>
          <p class="desc">${esc(w.desc || "설명 없음")}</p>
          <div class="meta">
            ${w.lang ? `<span class="chip lang" style="--dot:${LANG_DOT[w.lang] || "var(--accent)"}">${esc(w.lang)}</span>` : ""}
            ${(w.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
            ${w.pushed ? `<span>· ${fmtDate(w.pushed)} 수정</span>` : ""}
          </div>
          <div class="actions">
            <a class="btn primary go" href="${esc(open)}" target="_blank" rel="noopener">${w.url ? "열기 ↗" : "GitHub에서 보기 ↗"}</a>
            ${(w.links || []).map((l) => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}
            ${w.url ? `<a class="btn" href="${esc(gh)}" target="_blank" rel="noopener" title="GitHub 리포">GitHub</a>` : ""}
          </div>
        </div>`;
      grid.appendChild(card);
      if (isAdmin) paintCard(card);
      const th = card.querySelector(".thumb");
      if (useLive) { fitFrame(th); io ? io.observe(th) : loadFrame(th); }
    }
  }

  // 스위치: 다시 그리지 않고 카드만 갱신 (미리보기 iframe 유지)
  grid.addEventListener("change", (e) => {
    const input = e.target.closest(".switch input"); if (!input || role !== "admin") return;
    const card = input.closest(".card"), repo = card.dataset.repo;
    if (!pending) pending = new Set(hidden);
    input.checked ? pending.delete(repo) : pending.add(repo);
    if (!changedCount()) pending = null;
    paintCard(card);
    updateStatus(works.filter((w) => !HIDE.has(w.repo)));
    updateSavebar();
  });

  // ---------- 저장 바 ----------
  const savebar = $("#savebar"), saveBtn = $("#saveBtn");
  function updateSavebar() {
    const n = role === "admin" ? changedCount() : 0;
    $("#saveMsg").textContent = `변경 ${n}건`;
    savebar.classList.toggle("on", n > 0);
  }
  $("#saveCancel").addEventListener("click", () => {
    pending = null; document.querySelectorAll(".card[data-repo]").forEach(paintCard);
    updateStatus(works.filter((w) => !HIDE.has(w.repo))); updateSavebar();
  });
  saveBtn.addEventListener("click", () => saveVisibility());
  window.addEventListener("beforeunload", (e) => { if (changedCount()) { e.preventDefault(); e.returnValue = ""; } });

  // ---------- GitHub에 visibility.json 저장 ----------
  const TOKEN_KEY = "works:ghToken";
  const ghHeaders = (t) => ({ Authorization: `Bearer ${t}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
  async function saveVisibility() {
    if (!changedCount()) return;
    const token = store.get(TOKEN_KEY);
    if (!token) { openTokenSheet(true); return; }
    const api = `https://api.github.com/repos/${OWNER}/${SITE_REPO}/contents/visibility.json`;
    saveBtn.disabled = true; saveBtn.textContent = "저장 중…";
    try {
      let sha;
      const g = await fetch(`${api}?ref=main`, { headers: ghHeaders(token), cache: "no-store" });
      if (g.status === 401) throw Object.assign(new Error("토큰이 만료되었거나 잘못되었습니다"), { auth: true });
      if (g.ok) sha = (await g.json()).sha;
      const list = [...pending].sort();
      const json = JSON.stringify({ hidden: list, updated: new Date().toISOString() }, null, 2) + "\n";
      const content = btoa(String.fromCharCode(...new TextEncoder().encode(json)));
      const p = await fetch(api, {
        method: "PUT", headers: ghHeaders(token),
        body: JSON.stringify({ message: `카드 공개 설정 변경 (비공개 ${list.length}개)`, content, sha, branch: "main" })
      });
      if (p.status === 401 || p.status === 403) throw Object.assign(new Error("토큰에 testall 쓰기 권한이 없습니다"), { auth: true });
      if (!p.ok) throw new Error(`GitHub 저장 실패 (${p.status})`);
      hidden = new Set(list); pending = null;
      store.set("works:visSaved", JSON.stringify({ t: Date.now(), hidden: list }));
      document.querySelectorAll(".card[data-repo]").forEach(paintCard);
      updateStatus(works.filter((w) => !HIDE.has(w.repo))); updateSavebar();
      toast("저장했습니다 · 1~2분 뒤 모든 사람에게 반영됩니다");
    } catch (err) {
      toast(err.message || "저장하지 못했습니다", true);
      if (err.auth) openTokenSheet(true);
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = "저장";
    }
  }

  function openTokenSheet(thenSave) {
    showSheet(`
      <p class="note">공개 설정을 모든 사람에게 적용하려면 이 기기에 GitHub 토큰이 한 번 필요합니다. 토큰은 이 기기 브라우저에만 저장되고 GitHub 외에는 보내지 않습니다.</p>
      <ol>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 토큰 만들기</a>를 엽니다 (Fine-grained token).</li>
        <li>Repository access → <b>Only select repositories</b> → <b>${SITE_REPO}</b></li>
        <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
        <li><b>Generate token</b>을 누르고 나온 값을 아래에 붙여넣습니다.</li>
      </ol>
      <input class="field" id="tokIn" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <div class="err" id="tokErr"></div>
      <button class="btn primary wide" id="tokSave">확인 후 ${thenSave ? "저장" : "보관"}</button>`, "GitHub 토큰");
    $("#tokSave").addEventListener("click", async () => {
      const t = $("#tokIn").value.trim(), err = $("#tokErr");
      if (!t) { err.textContent = "토큰을 붙여넣어 주세요"; return; }
      err.textContent = "확인 중…";
      try {
        const r = await fetch(`https://api.github.com/repos/${OWNER}/${SITE_REPO}`, { headers: ghHeaders(t), cache: "no-store" });
        if (!r.ok) { err.textContent = r.status === 401 ? "토큰이 올바르지 않습니다" : `이 토큰으로 ${SITE_REPO} 리포를 볼 수 없습니다 (${r.status})`; return; }
        const j = await r.json();
        if (j.permissions && !j.permissions.push) { err.textContent = "Contents 쓰기(Read and write) 권한이 없습니다"; return; }
      } catch { err.textContent = "GitHub에 연결하지 못했습니다"; return; }
      store.set(TOKEN_KEY, t); hideSheet(); toast("토큰을 이 기기에 저장했습니다");
      if (thenSave) saveVisibility();
    });
  }

  // ---------- 입장 / 관리자 로그인 ----------
  const lockCode = $("#lockCode"), lockErr = $("#lockErr"), lockForm = $("#lockForm");
  function setRole(r) {
    role = r;
    r ? store.set("works:auth", r === "admin" ? H_ADMIN : H_USER) : store.del("works:auth");
    if (r !== "admin") pending = null;
    applyRole();
  }
  function applyRole() {
    document.body.classList.toggle("locked", !role);
    document.body.classList.toggle("admin", role === "admin");
    updateSavebar(); render();
    if (!role) setTimeout(() => lockCode.focus(), 50);
  }
  lockForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = lockCode.value.trim(); if (!v) return;
    const h = await sha256(v);
    if (h === H_ADMIN) { setRole("admin"); toast("관리자로 로그인했습니다"); }
    else if (h === H_USER) setRole("user");
    else {
      lockErr.textContent = "코드가 맞지 않습니다";
      lockForm.classList.remove("shake"); void lockForm.offsetWidth; lockForm.classList.add("shake");
      lockCode.select(); return;
    }
    lockCode.value = ""; lockErr.textContent = "";
  });

  $("#keyBtn").addEventListener("click", () => {
    showSheet(`
      <p class="note">관리자 코드를 입력하면 카드를 공개·비공개로 바꿀 수 있습니다.</p>
      <form id="adminForm" autocomplete="off">
        <input class="field" id="adminCode" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="관리자 코드" aria-label="관리자 코드">
        <div class="err" id="adminErr"></div>
        <button class="btn primary wide">로그인</button>
      </form>`, "관리자 로그인");
    setTimeout(() => $("#adminCode")?.focus(), 250);
    $("#adminForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (await sha256($("#adminCode").value.trim()) === H_ADMIN) { hideSheet(); setRole("admin"); toast("관리자로 로그인했습니다"); }
      else { $("#adminErr").textContent = "관리자 코드가 맞지 않습니다"; $("#adminCode").select(); }
    });
  });

  $("#adminPill").addEventListener("click", () => {
    const hasTok = !!store.get(TOKEN_KEY);
    showSheet(`
      <p class="note">관리자 모드입니다. 카드의 공개 스위치를 끄면 비공개가 되고, 저장하면 일반 사용자 화면에서 사라집니다.</p>
      <p class="note">GitHub 저장 토큰: <b>${hasTok ? "이 기기에 저장됨" : "없음 (처음 저장할 때 입력)"}</b></p>
      <div class="row">
        <button class="btn" id="tokBtn">${hasTok ? "토큰 바꾸기" : "토큰 넣기"}</button>
        ${hasTok ? `<button class="btn" id="tokDel">토큰 삭제</button>` : ""}
      </div>
      <div class="row">
        <button class="btn" id="adminOut">관리자 로그아웃</button>
        <button class="btn" id="lockOut">잠그기</button>
      </div>`, "🛡 관리자");
    $("#tokBtn").addEventListener("click", () => openTokenSheet(false));
    $("#tokDel")?.addEventListener("click", () => { store.del(TOKEN_KEY); hideSheet(); toast("토큰을 삭제했습니다"); });
    $("#adminOut").addEventListener("click", () => { hideSheet(); setRole("user"); toast("관리자 모드를 끝냈습니다"); });
    $("#lockOut").addEventListener("click", () => { hideSheet(); setRole(null); });
  });

  applyRole();
  loadVisibility();
  refreshFromGitHub();

  // ---------- 테마 ----------
  const themeBtn = $("#themeBtn");
  const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  try { applyTheme(localStorage.getItem("works:theme") || ""); } catch {}
  themeBtn.addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    const next = cur === "dark" ? "light" : "dark";
    applyTheme(next); try { localStorage.setItem("works:theme", next); } catch {}
  });

  // ---------- 설치 ----------
  const installBtn = $("#installBtn"), sheet = $("#sheet"), sheetBg = $("#sheetBg"), sheetBody = $("#sheetBody");
  let deferred = null;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  const inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
  function showSheet(html, title = "홈 화면에 추가") {
    $("#sheetTitle").textContent = title; sheetBody.innerHTML = html; sheet.classList.add("on"); sheetBg.classList.add("on");
  }
  function hideSheet() { sheet.classList.remove("on"); sheetBg.classList.remove("on"); }
  $("#sheetClose").addEventListener("click", hideSheet); sheetBg.addEventListener("click", hideSheet);

  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; if (!standalone) installBtn.hidden = false; });
  window.addEventListener("appinstalled", () => { installBtn.hidden = true; deferred = null; });
  if (!standalone && (isIOS || inApp)) installBtn.hidden = false;
  installBtn.addEventListener("click", async () => {
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch {} deferred = null; return; }
    if (inApp) {
      showSheet(`<p style="margin:0;color:var(--muted);font-size:14px;line-height:1.6">카카오톡·네이버 앱 안에서는 설치가 되지 않습니다. 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>(크롬·Safari)를 누른 뒤 다시 설치해 주세요.</p>
        <ol><li>주소: <code>${esc(location.href)}</code></li></ol>
        <div class="row"><button class="btn" id="copyUrl">주소 복사</button></div>`);
      $("#copyUrl")?.addEventListener("click", () => navigator.clipboard?.writeText(location.href));
      return;
    }
    if (isIOS) {
      showSheet(`<ol>
        <li>Safari 아래쪽 <b>공유</b> 버튼(네모에서 화살표가 올라가는 모양)을 누릅니다.</li>
        <li>목록에서 <b>홈 화면에 추가</b>를 고릅니다.</li>
        <li>오른쪽 위 <b>추가</b>를 누르면 홈 화면에 앱 아이콘이 생깁니다.</li></ol>`);
      return;
    }
    showSheet(`<ol>
      <li>크롬: 주소창 오른쪽 <b>설치</b> 아이콘 또는 ⋮ 메뉴 → <b>앱 설치</b> / <b>홈 화면에 추가</b></li>
      <li>삼성 인터넷: 아래 ≡ 메뉴 → <b>현재 페이지 추가</b> → <b>홈 화면</b></li></ol>`);
  });

  // ---------- 서비스 워커 ----------
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
